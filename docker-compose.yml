services:
  singbox-exporter:
    image: singbox-exporter:local
    build: .
    container_name: singbox-exporter
    restart: always
    network_mode: host
    command: ["-port", "9098", "-api", "http://127.0.0.1:9097"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9098/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
