version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - asasalint
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilerr
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars
  settings:
    gocritic:
      enabled-checks:
        - badLock
        - boolExprSimplify
        - emptyFallthrough
        - equalFold
        - hugeParam
        - importShadow
        - methodExprCall
        - ptrToRefParam
        - rangeExprCopy
        - rangeValCopy
        - truncateCmp
        - typeAssertChain
        - unlabelStmt
        - unnamedResult
        - unnecessaryBlock
    misspell:
      locale: UK
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
